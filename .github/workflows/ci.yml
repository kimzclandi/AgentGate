name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make ui-test docs-check
      - run: make trajectory-test
      - run: python3 scripts/score_trajectory.py docs/evidence/multiturn-v1 --output work/ci-trajectory
      - run: make check
      - run: make demo
      - run: make scan
